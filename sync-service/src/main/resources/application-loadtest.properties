# sync-service "loadtest" profile (T-22) — an ISOLATED load-test environment.
#
# Activate with: -Dspring.profiles.active=loadtest  (or SPRING_PROFILES_ACTIVE=loadtest).
#
# This profile is the ONLY context in which the CR13 edit-permission-check bypass
# can take effect, and only when app.loadtest.edit-check-disabled=true is ALSO set
# (default false). Without this profile the bypass is impossible — production never
# runs "loadtest", so the write-permission check (NFR13) can never be turned off there.
