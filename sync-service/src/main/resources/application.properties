# sync-service configuration (T-02, T-06, US-16)
#
# All sensitive values (CLIENT_ORIGIN in production, INTERNAL_API_TOKEN) must
# be supplied via environment variables or a local git-ignored .env file.
# Never commit real values here (NFR10).
#
# US-16 (DR3): Every DR3 value owned by sync-service is configured here.
# Override any value with an environment variable:
#   APP_ROOM_LIMITS_MAX_MEMBERS_PER_ROOM=50
# See docs/host-config.md for the full table of all DR3 values.

# Port agreed in T-06 (docs/api-contracts.md section 1).
# Override with SERVER_PORT env var (docker-compose.yml uses this).
server.port=${SERVER_PORT:8081}

# Actuator health endpoint at /actuator/health (T-06, T-08 smoke test).
# Only expose health; other actuator endpoints are not needed in Sprint 1.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Suppress the Spring Boot startup banner in logs.
spring.main.banner-mode=off

# Increase the maximum HTTP POST body size so execution-service can send
# run results (up to 4 MiB of stdout/stderr) to the internal endpoint.
server.tomcat.max-http-post-size=5MB
server.tomcat.max-swallow-size=5MB

# -----------------------------------------------------------------------
# Room-level resource limits (DR3, NFR15, FR31.2, NFR14) owned by sync-service (US-16).
# Values are PLACEHOLDER defaults; final per-host values are recorded only
# after the deployment host is fixed and tested (see docs/host-config.md).
# Override via APP_ROOM_LIMITS_* environment variables (no code change needed).
# -----------------------------------------------------------------------

# NFR15 – maximum number of members allowed in a single room.
# (US-16 creates this entry; enforcement wired in a later story.)
app.room.limits.max-members-per-room=${APP_ROOM_LIMITS_MAX_MEMBERS_PER_ROOM:10}

# FR31.2 – milliseconds a host may remain absent after a WebSocket
# disconnect before the room is force-closed.
# (US-16 creates this entry; enforcement wired in a later story.)
app.room.limits.host-leaves-timeout-ms=${APP_ROOM_LIMITS_HOST_LEAVES_TIMEOUT_MS:30000}

# NFR14 – aggregate wall-clock time budget (ms) across all runs in one
# room session. 0 = no aggregate cap (placeholder until US-63).
app.room.limits.aggregate-run-budget-ms=${APP_ROOM_LIMITS_AGGREGATE_RUN_BUDGET_MS:0}

# NFR14 – maximum number of run requests in a single room session.
# 0 = no cap (placeholder until US-63).
app.room.limits.max-runs-per-session=${APP_ROOM_LIMITS_MAX_RUNS_PER_SESSION:0}

# FR15 / US-30 execution history retention: PROVISIONAL 24-hour default (Sprint 6 final decision).
# Keep this in sync-service only; US-56 deletes ai-ml-service state with the room.
# Override with APP_RUN_HISTORY_RETENTION_SECONDS; must be positive.
app.run-history.retention-seconds=${APP_RUN_HISTORY_RETENTION_SECONDS:86400}
# Scheduled sweep interval (one minute by default), override via environment variable.
app.run-history.sweep-interval-ms=${APP_RUN_HISTORY_SWEEP_INTERVAL_MS:60000}
