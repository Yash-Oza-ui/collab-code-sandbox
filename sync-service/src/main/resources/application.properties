# sync-service configuration (T-02, T-06)
#
# All sensitive values (CLIENT_ORIGIN in production, INTERNAL_API_TOKEN) must
# be supplied via environment variables or a local git-ignored .env file.
# Never commit real values here (NFR10).

# Port agreed in T-06 (docs/api-contracts.md section 1).
# Override with SERVER_PORT env var (docker-compose.yml uses this).
server.port=${SERVER_PORT:8081}

# Actuator health endpoint at /actuator/health (T-06, T-08 smoke test).
# Only expose health; other actuator endpoints are not needed in Sprint 1.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Suppress the Spring Boot startup banner in logs.
spring.main.banner-mode=off

# Increase the maximum HTTP POST body size so execution-service can send
# run results (up to 4 MiB of stdout/stderr) to the internal endpoint.
server.tomcat.max-http-post-size=5MB
