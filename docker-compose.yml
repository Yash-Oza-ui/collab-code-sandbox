# Integration-test stack for collab-code-sandbox (T-08)
#
# Each service sits behind a profile with the same name as its folder, so the
# stack still starts while some folders are placeholders. Do not call
# `docker compose up` directly; use the helper, which turns on only the
# services whose folder has a Dockerfile:
#
#   bash tests/integration/up.sh      # build + start what exists
#   bash tests/integration/smoke.sh   # one PASS / SKIP / FAIL line per service
#   docker compose --profile "*" down
#
# Ports and health paths are PROVISIONAL defaults until T-06
# (docs/api-contracts.md) fixes them. Override them in a local .env file
# (copy .env.example). No secrets in this file (NFR10).

services:
  client:
    profiles: ["client"]
    build: ./client
    environment:
      PORT: ${CLIENT_PORT:-3000}
    ports:
      - "${CLIENT_PORT:-3000}:${CLIENT_PORT:-3000}"

  sync-service:
    profiles: ["sync-service"]
    build: ./sync-service
    environment:
      SERVER_PORT: ${SYNC_SERVICE_PORT:-8081} # Spring Boot reads SERVER_PORT
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # Room limits (DR3, NFR15, FR31.2, NFR14, US-16)
      APP_ROOM_LIMITS_MAX_MEMBERS_PER_ROOM: ${APP_ROOM_LIMITS_MAX_MEMBERS_PER_ROOM:-10}
      APP_ROOM_LIMITS_HOST_LEAVES_TIMEOUT_MS: ${APP_ROOM_LIMITS_HOST_LEAVES_TIMEOUT_MS:-30000}
      APP_ROOM_LIMITS_AGGREGATE_RUN_BUDGET_MS: ${APP_ROOM_LIMITS_AGGREGATE_RUN_BUDGET_MS:-0}
      APP_ROOM_LIMITS_MAX_RUNS_PER_SESSION: ${APP_ROOM_LIMITS_MAX_RUNS_PER_SESSION:-0}
      # Execution history retention (FR15 / US-30)
      APP_RUN_HISTORY_RETENTION_SECONDS: ${APP_RUN_HISTORY_RETENTION_SECONDS:-86400}
      APP_RUN_HISTORY_SWEEP_INTERVAL_MS: ${APP_RUN_HISTORY_SWEEP_INTERVAL_MS:-60000}
      # US-56 remote room-ended notification
      EXECUTION_SERVICE_URL: http://execution-service:${EXECUTION_SERVICE_PORT:-8082}
      APP_ROOM_CLEANUP_RETRY_DELAY_MS: ${APP_ROOM_CLEANUP_RETRY_DELAY_MS:-1000}
      APP_ROOM_CLEANUP_CHECK_INTERVAL_MS: ${APP_ROOM_CLEANUP_CHECK_INTERVAL_MS:-500}
    ports:
      - "${SYNC_SERVICE_PORT:-8081}:${SYNC_SERVICE_PORT:-8081}"

  execution-service:
    profiles: ["execution-service"]
    build: ./execution-service
    environment:
      SERVER_PORT: ${EXECUTION_SERVICE_PORT:-8082}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # US-60: run permission comes from sync-service by default. This stack keeps the
      # in-memory stub (fake rooms and sessions) because the legacy run scripts use them.
      # For real enforcement start with an EMPTY value:
      #   EXECUTION_SPRING_PROFILES= bash tests/integration/up.sh
      # (no colon in the default on purpose: an empty value stays empty).
      SPRING_PROFILES_ACTIVE: ${EXECUTION_SPRING_PROFILES-stub-permissions}
      # Where the permission lookup and the result broadcast reach sync-service (contract section 1).
      SYNC_SERVICE_INTERNAL_URL: ${SYNC_SERVICE_INTERNAL_URL:-http://sync-service:8081}
      AI_ML_SERVICE_URL: http://ai-ml-service:${AI_ML_SERVICE_PORT:-8000}
      APP_EXECUTION_LIMITS_MAX_QUEUE_LENGTH: ${EXECUTION_MAX_QUEUE_LENGTH:-10}
      # All other NFR4 / DR3 limits (US-16) – override via .env or docker compose env
      APP_EXECUTION_LIMITS_WALL_TIME_SECONDS: ${APP_EXECUTION_LIMITS_WALL_TIME_SECONDS:-5}
      APP_EXECUTION_LIMITS_MEMORY_MB: ${APP_EXECUTION_LIMITS_MEMORY_MB:-128}
      APP_EXECUTION_LIMITS_PIDS_LIMIT: ${APP_EXECUTION_LIMITS_PIDS_LIMIT:-64}
      APP_EXECUTION_LIMITS_MAX_OUTPUT_BYTES: ${APP_EXECUTION_LIMITS_MAX_OUTPUT_BYTES:-1048576}
      APP_EXECUTION_LIMITS_COMPILE_TIMEOUT_SECONDS: ${APP_EXECUTION_LIMITS_COMPILE_TIMEOUT_SECONDS:-10}
      APP_EXECUTION_LIMITS_QUEUE_RETRY_AFTER_SECONDS: ${APP_EXECUTION_LIMITS_QUEUE_RETRY_AFTER_SECONDS:-5}
      # NFR14 / US-64 – repeated-run per-request budget limits
      APP_EXECUTION_LIMITS_AGGREGATE_TIME_BUDGET_MS: ${APP_EXECUTION_LIMITS_AGGREGATE_TIME_BUDGET_MS:-20000}
      APP_EXECUTION_LIMITS_MAX_RUNS_PER_REQUEST: ${APP_EXECUTION_LIMITS_MAX_RUNS_PER_REQUEST:-10}
      APP_EXECUTION_LIMITS_BUDGET_RETRY_AFTER_SECONDS: ${APP_EXECUTION_LIMITS_BUDGET_RETRY_AFTER_SECONDS:-30}
      # Health details (in_flight, max_queue_length, retry_after_seconds) stay
      # hidden by default because this port is published. Only the integration
      # harness (tests/integration/up.sh, CI) sets this to "always".
      MANAGEMENT_HEALTH_SHOW_DETAILS: ${MANAGEMENT_HEALTH_SHOW_DETAILS:-never}
    ports:
      - "${EXECUTION_SERVICE_PORT:-8082}:${EXECUTION_SERVICE_PORT:-8082}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/collab-code-workspaces:/tmp/collab-code-workspaces

  ai-ml-service:
    profiles: ["ai-ml-service"]
    build: ./ai-ml-service
    environment:
      PORT: ${AI_ML_SERVICE_PORT:-8000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      EXECUTION_SERVICE_URL: http://execution-service:${EXECUTION_SERVICE_PORT:-8082}
      USE_STUB_RUNNER: ${USE_STUB_RUNNER:-false}
      VERIFICATION_NOISE_MARGIN_PCT: ${VERIFICATION_NOISE_MARGIN_PCT:-5.0}
      # AI/LLM limits (DR3, FR37.2, FR40.4, NFR5.3, NFR7.2, US-16)
      AI_SLOWDOWN_FACTOR: ${AI_SLOWDOWN_FACTOR:-1.0}
      AI_MAX_TOKENS_PER_REQUEST: ${AI_MAX_TOKENS_PER_REQUEST:-4096}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-10.0}
      ROOM_HOURLY_LIMIT: ${ROOM_HOURLY_LIMIT:-20}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      TOKEN_COST_PER_TOKEN: ${TOKEN_COST_PER_TOKEN:-0.0000035}
      # LLM API keys are never written here. Put them in your local .env
      # (git-ignored) and reference them as ${VARIABLE_NAME}.
    ports:
      - "${AI_ML_SERVICE_PORT:-8000}:${AI_ML_SERVICE_PORT:-8000}"
