server:
  port: 8082   # T-06 section 1: execution-service listens on 8082

spring:
  application:
    name: execution-service
  # US-60: permissions come from sync-service (HttpPermissionLookupService) unless the
  # in-memory stub is selected on purpose, e.g. SPRING_PROFILES_ACTIVE=stub-permissions
  # (the integration stack in docker-compose.yml does that for the legacy run scripts).
  # Enforce the 1 MiB run-request body cap (T-06 section 2).
  # Overridden by app.execution.limits.max-request-body-bytes at runtime.
  servlet:
    multipart:
      max-request-size: 1MB
      max-file-size: 1MB

# Spring Boot Actuator – exposes /actuator/health (T-06 section 1)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}

app:
  # CORS: allow requests from the browser client (T-06 section 2)
  # Override with CLIENT_ORIGIN env var in production.
  cors:
    allowed-origin: ${CLIENT_ORIGIN:http://localhost:3000}

  # sync-service connection (T-06 section 5, RoomBroadcastService)
  # INTERNAL_API_TOKEN must be set in your local .env (never commit the real value, NFR10).
  sync-service:
    internal-url:   ${SYNC_SERVICE_INTERNAL_URL:http://localhost:8081}
    internal-token: ${INTERNAL_API_TOKEN:}

  # Internal inter-service endpoint authentication (T-18 Decision 7, POST /internal/runs)
  internal:
    token: ${INTERNAL_API_TOKEN:}

  # ---------------------------------------------------------------
  # Resource limits for sandboxed code execution (DR3, NFR4, US-13)
  # Values are configured defaults; never hard-coded in Java (DR3).
  # ---------------------------------------------------------------
  execution:
    # Sandboxed Docker runtime images by language (DR1, DR3, US-14)
    images:
      cpp: collab-sandbox-cpp:0.1.0
      python: collab-sandbox-python:0.2.0
      c: collab-sandbox-c:0.1.0
      java: collab-sandbox-java:0.1.0
      javascript: collab-sandbox-javascript:0.1.0
    limits:
      # NFR4.1 – maximum wall-clock time per run (seconds)
      wall-time-seconds: 5
      # NFR4.2 – maximum memory per container (megabytes, swap disabled)
      memory-mb: 128
      # DR3 / DR5 / US-73 – maximum memory per container for sanitizer runs (megabytes)
      sanitizer-memory-mb: 512
      # NFR4.3 – maximum number of processes / threads inside the container
      pids-limit: 64
      # NFR4.4 – maximum total output (stdout + stderr combined, bytes)
      max-output-bytes: 1048576  # 1 MiB
      # NFR4.5 – compile-stage timeout for compiled languages (seconds)
      compile-timeout-seconds: 10
      # Maximum size of a single run request body (bytes)
      max-request-body-bytes: 1048576  # 1 MiB (T-06 section 2)
      # FR16 / US-11 – runs waiting or running at once; one more is refused with QUEUE_FULL
      max-queue-length: 10
      # FR16 – seconds sent in Retry-After and error.retry_after_seconds
      queue-retry-after-seconds: 5
      # NFR14 / US-64 / CR10 – aggregate wall-clock time budget per repeated-run request (milliseconds)
      aggregate-time-budget-ms: 20000
      # NFR14 / US-64 / CR10 – maximum number of runs per repeated-run request
      max-runs-per-request: 10
      # NFR14 / US-64 – seconds sent in Retry-After and error.retry_after_seconds on RUN_BUDGET_EXCEEDED
      budget-retry-after-seconds: 30
